name: Update REST API reference from the deployed server

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-rest-reference
  cancel-in-progress: true

jobs:
  update-rest-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate REST API reference tables
        run: python3 utils/generate_rest_reference.py 2> "$RUNNER_TEMP/drift.txt"

      - name: Open an issue for spec changes that need a description
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="REST API reference: deployed spec has undocumented changes"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "$(printf '%s\n\n```\n%s\n```\n\n%s' \
              "The daily REST reference sync found parameters or values in https://www.fused.io/server/openapi.json with no description:" \
              "$(cat "$RUNNER_TEMP/drift.txt")" \
              "Run each one against production, add its description to ROWS in utils/generate_rest_reference.py, then run python3 utils/generate_rest_reference.py.")"
          fi

      - name: Create or update PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/rest-api-reference
          add-paths: docs/rest-api/
          commit-message: "docs: sync REST API reference with the deployed server"
          title: "docs: sync REST API reference with the deployed server"
          body: |
            The deployed server's OpenAPI spec (https://www.fused.io/server/openapi.json) changed the type, default, limit or required flag of a parameter documented in `docs/rest-api/`.

            | Change | Why |
            |---|---|
            | Regenerated parameter tables with `utils/generate_rest_reference.py` | Types, defaults, limits and accepted values now match what production serves |

            Testing: review the table diff and check each changed value against production.
          delete-branch: true
