<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fused DeckGL</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />

    <script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const { DeckGL, TileLayer, BitmapLayer } = deck;
      new DeckGL({
        mapboxApiAccessToken:
          "pk.eyJ1IjoiaXNhYWNmdXNlZGxhYnMiLCJhIjoiY2xicGdwdHljMHQ1bzN4cWhtNThvbzdqcSJ9.73fb6zHMeO_c8eAXpZVNrA",
        mapStyle: "mapbox://styles/mapbox/dark-v10",
        initialViewState: {
          longitude: -122.465,
          latitude: 37.769,
          zoom: 15,
          pitch: 0,
        },
        controller: true,
        layers: [
          new TileLayer({
            id: "RasterTileLayer",
            data: `https://udf.ai/fc_fused/NAIP_Tile_Example/naip_tile/run/tiles/{z}/{x}/{y}?format=png`,
            maxZoom: 19,
            minZoom: 10,

            renderSubLayers: (props) => {
              const { boundingBox } = props.tile;

              return new BitmapLayer(props, {
                data: null,
                image: props.data,
                bounds: [
                  boundingBox[0][0],
                  boundingBox[0][1],
                  boundingBox[1][0],
                  boundingBox[1][1],
                ],
              });
            },
            pickable: true,
          }),
        ],
      });
    </script>
  </body>
</html>
